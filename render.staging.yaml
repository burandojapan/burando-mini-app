# Create a NEW Blueprint/service only. Never apply this to the live service.
services:
  - type: web
    name: burando-v7-staging
    runtime: python
    branch: develop
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEV_MODE
        value: "false"
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STAGING_SUPABASE_PROJECT_REF
        sync: false
      - key: STAGING_ISOLATION_CONFIRMED
        value: "false"
      - key: BOT_TOKEN
        sync: false
