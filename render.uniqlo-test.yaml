# TEST-only remote caller. No Supabase or admin credentials in the cron process.
services:
  - type: cron
    name: burando-uniqlo-test-daily
    runtime: python
    repo: https://github.com/burandojapan/burando-mini-app
    branch: develop
    region: virginia
    plan: 0.5c-512mb
    schedule: "0 21 * * *" # 06:00 Japan / 02:00 Uzbekistan, daily
    buildCommand: python --version
    startCommand: python scripts/uniqlo_remote_daily.py
    autoDeployTrigger: "off"
    envVars:
      - key: UNIQLO_JOB_URL
        value: https://burando-v7-staging.onrender.com/api/internal/uniqlo/daily
      - key: UNIQLO_JOB_KEY
        sync: false
